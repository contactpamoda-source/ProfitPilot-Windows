name: Build ProfitPilot Setup and Portable
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all app files exist
        shell: pwsh
        run: |
          foreach ($file in @('index.html','main.js','preload.js','package.json')) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing application source: $file" }
          }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          node --check main.js
          node --check preload.js
      - name: Generate ProfitPilot branded Windows icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed' }
          python scripts/generate_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed' }
          if (-not (Test-Path 'assets/profitpilot-icon.ico')) { throw 'Missing Windows icon' }
      - name: Build Windows Setup installer
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { throw 'NSIS Setup build failed' }
      - name: Build portable Windows app
        shell: pwsh
        run: |
          npx electron-builder --win portable --x64 --publish never '--config.artifactName=ProfitPilot Portable ${version}.${ext}'
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed' }
      - name: Confirm Setup.exe (not unpacked app)
        shell: pwsh
        run: |
          $setups = @(Get-ChildItem -Path dist -File -Filter '*.exe' | Where-Object { $_.Name -like '*Setup*' })
          if ($setups.Count -ne 1) {
            Get-ChildItem dist -Recurse | Select-Object FullName
            throw "Expected one Setup.exe, found $($setups.Count)."
          }
          if ($setups[0].Length -lt 1000000) { throw "Installer unexpectedly small" }
          Write-Host "Verified NSIS installer: $($setups[0].FullName)"
      - name: Upload no-install browser UI preview
        uses: actions/upload-artifact@v4
        with:
          name: ProfitPilot-Browser-Preview-No-EXE
          path: |
            index.html
            assets/report-xlsx.js
          if-no-files-found: error
          retention-days: 30
      - name: Upload installer only
        uses: actions/upload-artifact@v4
        with:
          name: ProfitPilot-Setup-Windows
          path: dist/*Setup*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Verify portable application
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem dist -File -Filter '*.exe' | Where-Object { $_.Name -match 'Portable' })
          if ($portable.Count -lt 1) {
            Get-ChildItem dist -File | Select-Object Name
            throw 'Portable EXE was not generated.'
          }
      - name: Upload portable app for no-install testing
        uses: actions/upload-artifact@v4
        with:
          name: ProfitPilot-Portable-No-Install
          path: dist/*Portable*.exe
          if-no-files-found: error
          retention-days: 30
